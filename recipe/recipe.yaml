schema_version: 1

context:
  name: flet-cli
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flet_cli-${{ version }}.tar.gz
  sha256: 57a0aa609352cd764b4ad839585bba88637e1f0d293d082f54025c0c78d44053

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - flet ==${{ version }}
    - watchdog >=4.0.0
    - packaging >=25.0
    - qrcode >=7.4.2
    - cookiecutter >=2.6.0
    - chardet <6
    - binaryornot <0.5
    - rich >=13.0.0
    - flet-platform-assets ==1.0.1

tests:
  - python:
      imports:
        - flet_cli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/flet-dev/flet/tree/main/sdk/python/packages/flet-cli
  summary: Flet CLI is a command-line interface tool for Flet, a framework for building interactive multi-platform applications using Python.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
